<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div id="main" style="width: 600px;height:400px;"></div>
    <script>
        var chart = echarts.init(document.getElementById('main'));
        var option = {
            series: {
                type: 'sankey',
                layout: 'none',
                layoutIterations: 0,
                data: [
                    {name: 'Total'},
                    {name: 'A', value: 100},
                    {name: 'B', value: 50},
                    {name: 'C', value: 10}
                ],
                links: [
                    {source: 'Total', target: 'A', value: 100},
                    {source: 'Total', target: 'B', value: 50},
                    {source: 'Total', target: 'C', value: 10}
                ]
            }
        };
        chart.setOption(option);
    </script>
</body>
</html>
